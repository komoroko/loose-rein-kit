# What rein hands an agent, section by section, and what holds each instruction in it (devr 論点 Q, 論点 U).
#
# A section is one of:
#   `unverified`  it asks an agent for something nothing checks.
#   `none`        it asks an agent for nothing: it describes the machine.
#   a mapping     `held`: the sentences that are checked, each with `by` — `scenario:<name>`, a behaviour
#                 test whose every record matches what ships and `holds` (devr 論点 T), or
#                 `tests/<file>::<function>`, a unit test showing the code refuse or catch the violation;
#                 and `rest`: `unverified` or `none`, for whatever else the section asks.
#
# A `code` with nothing named is the writer's account and is refused. `template_lint` refuses a section
# missing from here, an entry for a section that no longer exists, a held sentence not in its section
# exactly once, and a `by` that does not hold it. Updated with every change request that touches a prompt.

