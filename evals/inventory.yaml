# How each section of what rein hands an agent is held to account (devr 論点 Q).
#
# `code`: a mechanism enforces what the section says, whatever an agent makes of it.
# `scenario:<name>`: a behaviour test in evals/scenarios/ holds a sentence of it, against a control.
# `unverified`: neither. The section is a claim nothing has tested.
#
# `template_lint` refuses a section missing from here, an entry for a section that no longer exists,
# and a `scenario:` entry whose scenario does not guard that section. Updated with every change
# request that touches a prompt.

