# yaml-language-server: $schema=schema/config.schema.json
# .rein/config.yaml — the execution knobs, frozen wholesale when the mandate is approved.
#
# What may NOT go in this file matters as much as what may: no principal, no role, no
# authority, no provider executable path, no credential. Those live OUTSIDE the repository
# ($XDG_CONFIG_HOME/rein/trust.yaml and providers.yaml), so a pull request cannot widen
# its own permissions by editing a file it also ships.
#
# Unknown keys are rejected. An inert typo would mean "the knob you thought you
# set" quietly wasn't set.

project:
  name: loose-rein-kit
  work_branch: build/loose-rein-kit   # `rein init --name X` rewrites this to build/X

execution:
  max_parallel: 3            # concurrent independent leaf tasks within the frontier
  worktree_dir: .worktrees   # already .gitignore'd
  command_timeout_sec: 1800
  agent_timeout_sec: 0        # 0 = no limit; a clock cannot tell working from stuck

# Which sandbox the quality gate's command steps run in. The bodies are below.
#
# One key, because one path reaches an executor. This block also carried `implementer_profile` and
# `reviewer_profile`, and they wrapped nothing: every agent CLI — implementer, reviewer, every
# fixer — is launched as a host process from `rein` itself, and the only calls into the executor
# are the quality gate's command steps and the dependency audit. Setting them bought a sandbox
# nobody entered, and told the agent, in its dossier, that it was inside one.
executors:
  quality_gate_profile: quality

# ---------------------------------------------------------------------------
# SANDBOXES.
#
# **What this isolates, exactly.** The quality gate's `kind: command` steps and the acceptance
# criteria that go through the same runner — the places this tool *executes* repository-derived
# code. That is the rule: a test file is code an agent wrote, and running it on the host runs it
# with your credentials. A fresh repository ships `kind: host`, which is NOT policy-compliant;
# `rein doctor` reports it as a FAIL until you fix it, and `rein init` offers to do it for you.
#
# **The agent CLI that wrote that code is the other box, and an optional one.** Set
# `executors.agent_profile` to a `kind: oci-agent` profile and every implementer, reviewer and
# fixer is launched inside it: the worktree mounted read-write at /work, the control socket bound
# in so a leaf can still report what it did, and no HOME of yours, no ~/.ssh, no ~/.aws, no docker
# socket, no capabilities. That kind IS granted egress — an agent that cannot reach its model API
# does nothing — so it is not a boundary against exfiltration and does not claim to be; what it
# buys is that the process writing your code cannot read the rest of your machine.
#
#     rein oci build --profile agent --build-arg AGENT_CLI=@anthropic-ai/claude-code --write-config
#
# The CLI is a build argument because it is the one thing this package cannot choose for you, and
# that is also why the key is optional: leaving it unset launches the agent on the host with your
# credentials, isolated only by whatever the adapter establishes for itself (`codex exec`
# establishes seccomp/landlock around its work; `claude -p` carries the project's permissions).
# Either way `rein doctor`, the dossier and the acceptance brief say which it was. When you do box
# it, configure the adapter NOT to sandbox itself: two nested sandboxes fail at the point the agent
# writes, and `rein doctor` warns about exactly that combination.
#
#     rein oci build --all --write-config   # build the packaged image and pin it here
#
# That is the whole setup, and it is what `rein next`, `rein doctor` and the dashboard all
# recommend. It needs docker or podman on PATH; it builds each packaged Containerfile, writes the
# resulting digests into the profiles below, flips them to `kind: oci`, and verifies the pins
# resolve. To do it one at a time instead — `--profile` names a packaged Containerfile, NOT a
# profile below, so the `quality` profile builds from `python`, which is what its
# `containerfile:` key says (`rein oci list` prints the whole set):
#
#     rein oci build --profile python --write-config       # the quality-gate image
#
# Without `--write-config` it prints a digest to paste in by hand. The pinned digest — never a
# tag — is what stops the environment a review ran in from changing after that review was approved.
#
# Pinning is not the whole job: the image has to be able to RUN the step you point at it. The
# packaged images carry python, uv and pytest and run with `--network none`, so a quality-gate
# step that invokes `make`, that lints or type-checks, or that resolves dependencies at run time,
# needs its own Containerfile before its profile can leave `kind: host`.
#
# Writing one is two lines of config and a file. Put the Containerfile anywhere in the repository
# — `.rein/oci/<name>/Containerfile` keeps it beside the packaged ones — install what your gate
# actually runs, and point the profile at it with `dockerfile:` INSTEAD of `containerfile:`
# (they are mutually exclusive; the pinned `image` digest stays the binding fact either way):
#
#     # .rein/oci/quality/Containerfile
#     FROM docker.io/library/python:3.13-slim-bookworm@sha256:<pin a digest, never a tag>
#     RUN pip install --no-cache-dir "pytest==9.0.3" "ruff==0.15.16" "mypy==2.1.0"
#     USER 1000:1000
#     WORKDIR /work
#
#     # …and in the profile below, replacing its `containerfile:` (the two are exclusive):
#     quality:
#       dockerfile: .rein/oci/quality/Containerfile
#
# `rein oci build --profile <that profile name> --write-config` then builds YOUR file and pins the
# digest — once a profile sets `dockerfile:`, `--profile` resolves to it instead of to a packaged
# Containerfile. Everything the gate needs has to be IN the image: the runner gives it no network,
# so a step that installs at run time fails there however well it works on your machine.
# ---------------------------------------------------------------------------
executor_profiles:
  quality:
    kind: host
    containerfile: python
    # kind: oci
    # image: localhost/rein-python@sha256:<rein oci build prints this>
    # network_profile: none
    # read_only_root: true
    # mount_repo: read_write   # the test step writes its JUnit report into the checkout
    # writable_tmp_mb: 512
    # pids_limit: 128
    # memory_mb: 1024
    # cpu_count: 2

  # The agent box. Commented out because it is optional and because the image has to carry your
  # CLI — uncomment after `rein oci build --profile agent --build-arg AGENT_CLI=... --write-config`
  # and point `executors.agent_profile` at it. `network_profile: egress` is the only value this
  # kind takes, and `none` is the only value `kind: oci` takes; the runner refuses the other way
  # round, which is why the two are separate kinds rather than one kind with a knob.
  # agent:
  #   kind: oci-agent
  #   containerfile: agent
  #   image: localhost/rein-agent@sha256:<rein oci build prints this>
  #   network_profile: egress
  #   env_allowlist: [ANTHROPIC_API_KEY]   # the model credential, and nothing else
  #   memory_mb: 4096
  #   cpu_count: 4

agents:
  implementer:
    adapter: claude
  code_reviewer:
    adapter: claude
  # `model` is passed to the CLI, and the independence group a critical change is checked
  # against is derived from it (`<adapter>/<model>`) — so a separation written here is one the
  # launch actually makes. The extractor and the comparator must differ (plan 12.4).
  actual_extractor:
    adapter: claude
    model: opus
  comparator:
    adapter: claude
    model: sonnet
  # Deliberately the extractor's model, not the comparator's: 12.4 constrains the
  # extractor/comparator pair and says nothing about this role, and matching the extractor lets
  # the two stages share one reading of the source half of the change
  # (`review_transport.SharedReading`). They still reach independent verdicts — the session is
  # branched, never continued — and only this role is then sent the test half, because tests run
  # with your credentials and because a test name paraphrases the requirement the blind extractor
  # must not read.
  security_reviewer:
    adapter: claude
    model: opus

# The single definition of the DoD. `command` is an argv array — no shell, so a pipe or a
# redirect has to live in a script a reviewer can read.
#
# The two defaults below are what the PACKAGED `python` image can actually run: it carries python,
# uv and pytest, nothing else, and the runner gives it no network. They used to be `make test` and
# `make check`, which was a default that could not work anywhere — `rein init` writes no makefile,
# and the image has no `make` either, so following doctor's advice to sandbox the profiles pinned
# the DoD to an image that could not execute it.
#
# They are a floor, not a quality bar. `compileall` catches a syntax error and nothing else; the
# moment you want a linter, a type checker, or a dependency closure, point the profile at your own
# image with `dockerfile:` (see `executor_profiles` above) and put the real commands here.
quality_gate:
  - name: test
    kind: command
    command: [python, -m, pytest, -q, tests/, --junitxml=.rein/work/junit-test.xml]
    executor_profile: quality
    retries: 2
    required: true
    # The step that runs the tests: the one the negative control re-establishes over the base with
    # only a task's test half applied. A linter's red there is true of any new test file.
    runs_tests: true
    # The report the command above writes. With it a red is read per failing test: one that passes
    # on an immediate re-run is flaky, and one already red before the task's change goes to the
    # task that owns it rather than stopping this one. Keep the two paths the same.
    junit: .rein/work/junit-test.xml
  - name: check
    kind: command
    command: [python, -m, compileall, -q, .]
    executor_profile: quality
    retries: 2
    required: true
  - name: review
    kind: agent
    agent_role: code_reviewer
    retries: 1
    required: true
  # A minimal real-launch check. Replace `command` as soon as any entry point launches —
  # tests stay green while the launch path is broken — then set `required: true`.
  # (Quoted: unquoted `true` in YAML is the boolean, not the /bin/true command.)
  - name: smoke
    kind: command
    command: ["true"]
    executor_profile: quality
    retries: 1
    required: false

security:
  # THE ONE SECURITY ANSWER GATE 5 CANNOT CARRY FROM GATE 4.
  #
  # Everything else it needs it already has: the structured review is bound to the reviewed HEAD
  # and its blocking findings hold this gate shut too. A dependency audit is different in kind —
  # the same commit audited last month and today can differ, because the database moved while the
  # code did not. So it is the one thing that must actually be RUN at acceptance, and the one piece of
  # evidence here that expires without anything in the repository changing.
  #
  # `rein audit run` runs this and records what it said, bound to a digest over this tree's
  # manifests and lockfiles — so editing source does not retire the answer, and changing a
  # dependency does. Acceptance refuses a change with no audit, a stale one, or a failing one.
  #
  # Replace the command with your ecosystem's: pip-audit, `npm audit --audit-level=high`,
  # `cargo audit`, `make audit`. A project that declares none is told at acceptance that it has no
  # dependency answer at all, which is not the same as having a clean one.
  dependency_audit:
    command: [uv, run, pip-audit, --strict]
    # No `executor_profile`, so this runs on the host — and that is the only place it can run. An
    # audit reads a published vulnerability database, and no sandbox here is granted egress
    # (`network_profile` may only be `none`), so naming a sandboxed profile is refused rather than
    # left to fail as if the dependencies were what was wrong. Name one only to point at another
    # `kind: host` profile. This runs a scanner over manifests, not the repository's own code.
    # How long the recorded answer speaks for. Nothing in the repository has to change for it to
    # stop being true.
    max_age_days: 7

review_policy:
  # How acceptance takes its reading. `auto` composes it from the plan's task scopes — one reading
  # per scoped task, plus the seam over what two scopes share or none covers — so one launch
  # holds one task's slice rather than a whole cycle, and a review regenerated after a fix
  # re-reads only the task whose code moved. `whole` never composes and pays for one reading of
  # everything. At critical risk the change is read whole whatever this says: composition reads
  # each slice and the seam, which cannot rule out behaviour that exists only once two slices are
  # in one tree, and `coverage.composition` says so rather than hiding it.
  #
  # A plan whose tasks declare no `scope` has nothing to compose along and is read whole either
  # way. `rein dag --render` says which of the two this plan will get, at the mandate, while it can
  # still be changed.
  composition: auto
  # Exceeding a budget SPLITS THE SCOPE. It never lengthens the review screen: a reviewer
  # asked to hold 80 statements in their head is not reviewing, they are skimming.
  #
  # The first three bound what one PERSON holds at acceptance, and are measured over the whole
  # review. `max_diff_bytes` bounds what one LAUNCH reads, so it is measured against a single
  # reading — under `composition: auto` that is one task's slice, never the cycle. A change too
  # big for one reading is a task whose scope is too broad, which is a thing to fix at the mandate
  # while splitting is still a move that exists.
  # How many times acceptance may repair its own blocking findings and read the change again before
  # it stops and asks. A finding is repaired only when a task's declared scope owns the code it
  # anchored to and the fix changes no claim, criterion or requirement — and the NEXT reading is
  # what decides whether it closed, never the fixer's account of it. Bounded because the failure
  # this must survive is a false positive: repairing something that was never true converges on
  # nothing. 0 turns it off, and `rein build` then takes no reading at all.
  repair_rounds: 2
  budgets:
    max_diff_bytes: 524288

guard:
  # true while this repo IS the Loose Rein template (its scaffold originals share paths with
  # product deliverables). `rein init` writes false for products — that is when the
  # editor-hook guard goes live.
  template_mode: true
  # What a mandate authorizes changes to. Each path guards the file it names and everything beneath
  # it; the trailing "/" is optional punctuation. The prefix is anchored at a separator, so `src`
  # guards src/a.py and never srcfile.py, and the most specific entry wins.
  #
  # Writing one of these needs two things: an approved mandate, and that mandate's own
  # `scope` in plan.yaml covering the path. Entries used to name which of five phase gates opened
  # them (`{ path: src/, requires_gate: tasks }`) — a guard enforcing an order. The documents were
  # in here too, each waiting on the phase before it; they are the material a mandate is written
  # from, so there is nothing for them to wait on.
  #
  # tests/ is deliberately NOT guarded: preparing fixtures while the mandate is open is
  # sanctioned speculative work.
  paths:
    - src/
    - lib/
    - app/
    - backend/
    - frontend/
    - scripts/

github:
  enabled: false        # off by default: offline-safe. The plan stays the SSOT either way.
  label: rein
  close_on_done: true
  repo: ""              # empty: gh infers from origin
