# The packaged lens library. `$XDG_CONFIG_HOME/rein/lenses.yaml` overlays it by id.
#
# Every lens carries a condition, because a lens with no condition is one nobody can tell apart
# from a lens whose condition is "always" — the first is unfinished and the second is rare. The
# class says how confidently the condition can be decided, and that is what sets the behaviour:
#
#   standard      decidable from the mandate — applied when it holds, nobody is asked
#   conditional   there is a condition but deciding it takes judgement — proposed at the gate
#   unclassified  nothing written down about when it applies — off until somebody says otherwise
#
# `applies_when` is prose for the human who reads the gate screen. `paths` and `claim_risk` are the
# machine-decidable part: `paths` are fnmatch patterns against the change, `claim_risk` is the floor
# a claim's risk must reach. Both empty means the condition does not turn on that axis.
lenses:
  # --- requirements ----------------------------------------------------------
  - id: L-REQ-TESTABILITY
    stage: requirements
    class: standard
    attack: >-
      For each acceptance criterion, attempt an implementation that satisfies its letter while
      betraying its intent. If you succeed, the criterion is too weak.
    applies_when: any requirement states an acceptance criterion
    origin: packaged
  - id: L-REQ-AMBIGUITY
    stage: requirements
    class: standard
    attack: >-
      Exhibit two materially different readings of the same requirement that both fit the text.
    applies_when: always — two readings of one sentence is a defect in any requirement
    origin: packaged
  - id: L-REQ-FAILURE-MODES
    stage: requirements
    class: standard
    attack: >-
      Empty, concurrent, oversized, failing-dependency and malicious inputs the requirements never
      mention.
    applies_when: the requirements describe anything that takes input from outside itself
    origin: packaged
  - id: L-REQ-HIDDEN-ASSUMPTIONS
    stage: requirements
    class: standard
    attack: >-
      What must be true for a requirement to make sense that nothing in the brief or the
      requirements states.
    applies_when: always — an unstated premise is invisible by construction
    origin: packaged
  - id: L-REQ-CONTRADICTIONS
    stage: requirements
    class: standard
    attack: >-
      Requirement against requirement, requirement against brief, a Must against the out-of-scope
      list.
    applies_when: the cycle states more than one requirement
    origin: packaged
  - id: L-REQ-SCOPE
    stage: requirements
    class: standard
    attack: >-
      A Must the brief does not actually need; a need the brief implies that no R-x covers.
    applies_when: always — both directions of the brief-to-requirement thread
    origin: packaged

  # --- design ----------------------------------------------------------------
  - id: L-DES-COVERAGE
    stage: design
    class: standard
    attack: >-
      An `R-x → design` section that, built exactly as written, would not satisfy R-x's acceptance
      criteria.
    applies_when: always — this is the design's own claim about itself
    origin: packaged
  - id: L-DES-FAILURE-WALK
    stage: design
    class: standard
    attack: >-
      Make each component fail, slow down, or run concurrently. What breaks, and does the design
      say so?
    applies_when: the design names more than one component, a process boundary, or a dependency
    origin: packaged
  - id: L-DES-INFEASIBILITY
    stage: design
    class: standard
    attack: >-
      Sketch the hardest implementation step and name the blocking unknown the design glosses over.
    applies_when: always — the step nobody sketched is the one that stops the build
    origin: packaged
  - id: L-DES-UNSTATED-ASSETS
    stage: design
    class: standard
    attack: >-
      Unstated assumptions about existing assets, libraries or environments the design silently
      relies on.
    applies_when: always
    origin: packaged
  - id: L-DES-YAGNI
    stage: design
    class: standard
    attack: >-
      A design element no requirement forces. Name the requirement that would justify it, or flag
      it.
    applies_when: always — the cheapest defect to remove is the one nothing asked for
    origin: packaged
  - id: L-DES-NFR-HOLES
    stage: design
    class: conditional
    attack: >-
      Security, performance and operability gaps measured against the NFR-x criteria — never
      against generic best practice.
    applies_when: the cycle declares NFR requirements. With none declared there is nothing to
      measure against, and the lens degrades into generic advice.
    claim_risk: medium
    origin: packaged
  - id: L-DES-ADR
    stage: design
    class: conditional
    attack: >-
      Is a chosen option's downside underplayed relative to the rejected options' downsides?
    applies_when: the design records an ADR with rejected options
    origin: packaged

  # --- task plan -------------------------------------------------------------
  - id: L-TASK-MISSING-EDGE
    stage: tasks
    class: conditional
    attack: >-
      Two tasks where building one without the other in place fails — shared file, shared schema,
      runtime dependency — yet no `blocked_by` edge exists.
    applies_when: the plan has more than one task. A single-task plan has no edge to miss.
    origin: packaged
  - id: L-TASK-COLLISION
    stage: tasks
    class: conditional
    attack: >-
      Parallel leaves whose tickets imply touching the same files — the merge-conflict predictor.
      Name the files.
    applies_when: the plan has parallel leaves. Serial plans collide with nothing.
    origin: packaged
  - id: L-TASK-UNTESTABLE-ACCEPTANCE
    stage: tasks
    class: standard
    attack: >-
      A ticket whose acceptance criteria cannot objectively decide green — a vague criterion, or
      `evidence` naming a command that would pass trivially. Target cases that would not go red if
      the described behaviour were wrong.
    applies_when: always — a criterion that cannot fail is the DoD not applying to this task
    origin: packaged
  - id: L-TASK-SCOPE
    stage: tasks
    class: standard
    attack: >-
      Work in a ticket that no covered requirement forces, or a requirement facet its covering
      ticket's acceptance criteria never exercise.
    applies_when: always — both directions of the claim-to-task thread
    origin: packaged
  - id: L-TASK-CUTOVER
    stage: tasks
    class: conditional
    attack: >-
      A plan that splits the removal of shared infrastructure across intermediate tasks. Show the
      task that would fail its own DoD mid-sequence.
    applies_when: the cycle removes or replaces something more than one task depends on
    origin: packaged
  - id: L-TASK-UNREADABLE-PLAN
    stage: tasks
    class: standard
    attack: >-
      Tasks whose `scope` is missing or so wide that it covers most of the repository. The finding
      is not that it is untidy — it is that this cycle's review cannot be taken in slices.
    applies_when: always — acceptance reads the change along the scopes this plan freezes
    origin: packaged
