# yaml-language-server: $schema=schema/config.schema.json
# .rein/config.yaml — the execution knobs, frozen wholesale at gate 3.
#
# What may NOT go in this file matters as much as what may: no principal, no role, no
# authority, no provider executable path, no credential. Those live OUTSIDE the repository
# ($XDG_CONFIG_HOME/rein/trust.yaml and providers.yaml), so a pull request cannot widen
# its own permissions by editing a file it also ships.
#
# Unknown keys are rejected. An inert typo would mean "the knob you thought you
# set" quietly wasn't set.

project:
  name: product
  work_branch: build/product   # `rein init --name X` rewrites this to build/X

execution:
  max_parallel: 3            # concurrent independent leaf tasks within the frontier
  worktree_dir: .worktrees   # already .gitignore'd
  command_timeout_sec: 1800
  agent_timeout_sec: 3600

# Which sandbox each role runs in. The bodies are below.
executors:
  implementer_profile: implementer
  reviewer_profile: reviewer
  quality_gate_profile: quality

# ---------------------------------------------------------------------------
# SANDBOXES.
#
# A fresh repository ships `kind: host`, which is NOT policy-compliant: anything that runs
# repository-derived code, tests, or build scripts must run under an `oci` profile regardless
# of risk (a test file is code an agent wrote, and it runs with your credentials).
# `rein doctor` reports this as a FAIL until you fix it, and `rein init` offers to do it for you.
#
#     rein oci build --all --write-config   # build all three and pin them here
#
# That is the whole setup, and it is what `rein next`, `rein doctor` and the dashboard all
# recommend. It needs docker or podman on PATH; it builds each packaged Containerfile, writes the
# resulting digests into the profiles below, flips them to `kind: oci`, and verifies the pins
# resolve. To do it one at a time instead — `--profile` names a packaged Containerfile, NOT a
# profile below, so the `quality` profile builds from `python`, which is what its
# `containerfile:` key says (`rein oci list` prints the whole set):
#
#     rein oci build --profile python --write-config       # the quality-gate image
#     rein oci build --profile reviewer --write-config
#     rein oci build --profile implementer --write-config
#
# Without `--write-config` each prints a digest to paste in by hand. The pinned digest — never a
# tag — is what stops the environment a review ran in from changing after that review was approved.
#
# Pinning is not the whole job: the image has to be able to RUN the step you point at it. The
# packaged images carry python, uv and pytest and run with `--network none`, so a quality-gate
# step that invokes `make`, or that resolves dependencies at run time, needs its own
# Containerfile before its profile can leave `kind: host`.
# ---------------------------------------------------------------------------
executor_profiles:
  quality:
    kind: host
    containerfile: python
    # kind: oci
    # image: localhost/rein-python@sha256:<rein oci build prints this>
    # network_profile: none
    # read_only_root: true
    # mount_repo: read_only
    # writable_tmp_mb: 512
    # pids_limit: 128
    # memory_mb: 1024
    # cpu_count: 2

  reviewer:
    kind: host
    containerfile: reviewer
    # A reviewer container never mounts the canonical store or the gate receipts: an AI that
    # can edit the record does not need to convince anyone of anything.
    # env_allowlist: [MODEL_API_KEY]

  implementer:
    kind: host
    containerfile: implementer
    # mount_repo: read_write

agents:
  implementer:
    adapter: claude
  code_reviewer:
    adapter: claude
  actual_extractor:
    adapter: claude
    independence_group: claude/opus
  comparator:
    adapter: claude
    independence_group: claude/sonnet
  security_reviewer:
    adapter: claude
    independence_group: claude/sonnet

# The single definition of the DoD. `command` is an argv array — no shell, so a pipe or a
# redirect has to live in a script a reviewer can read.
quality_gate:
  - name: test
    kind: command
    command: [make, test]
    executor_profile: quality
    retries: 2
    required: true
  - name: check
    kind: command
    command: [make, check]
    executor_profile: quality
    retries: 2
    required: true
  - name: review
    kind: agent
    agent_role: code_reviewer
    retries: 1
    required: true
  # A minimal real-launch check. Replace `command` as soon as any entry point launches —
  # tests stay green while the launch path is broken — then set `required: true`.
  # (Quoted: unquoted `true` in YAML is the boolean, not the /bin/true command.)
  - name: smoke
    kind: command
    command: ["true"]
    executor_profile: quality
    retries: 1
    required: false

review_policy:
  # Exceeding a budget SPLITS THE SCOPE. It never lengthens the review screen: a reviewer
  # asked to hold 80 statements in their head is not reviewing, they are skimming.
  budgets:
    max_critical_decisions: 5
    max_human_statements: 30
    max_unresolved_low_medium_unknowns: 5
    max_diff_bytes_per_partition: 524288

guard:
  # true while this repo IS the Loose Rein template (its scaffold originals share paths with
  # product deliverables). `rein init` writes false for products — that is when the
  # editor-hook guard goes live.
  template_mode: true
  # A path ending in "/" guards that prefix; any other path guards that exact file. Exact
  # wins over prefixes, longest prefix wins. tests/ is deliberately NOT guarded: preparing
  # fixtures while a gate is pending is sanctioned speculative work.
  paths:
    - { path: docs/20-design.md, requires_gate: requirements }
    - { path: docs/decisions/, requires_gate: requirements }
    - { path: docs/tasks/, requires_gate: design }
    - { path: docs/test/, requires_gate: build }
    - { path: src/, requires_gate: tasks }
    - { path: lib/, requires_gate: tasks }
    - { path: app/, requires_gate: tasks }
    - { path: backend/, requires_gate: tasks }
    - { path: frontend/, requires_gate: tasks }
    - { path: scripts/, requires_gate: tasks }

github:
  enabled: false        # off by default: offline-safe. The plan stays the SSOT either way.
  label: rein
  close_on_done: true
  repo: ""              # empty: gh infers from origin
