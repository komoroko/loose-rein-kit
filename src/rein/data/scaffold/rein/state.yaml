# .rein/state.yaml — this project's MUTABLE state. Nothing else.
#
# Task titles, dependencies, and claim mappings are NOT here: they live in plan.yaml, frozen
# when the mandate is approved. Duplicating them is how two documents drift apart.
#
# Nor is "what phase are we in". Where the cycle stands follows from the two gates below and is
# derived, never stored — `drafting` until the mandate is approved, `building` until the change is
# accepted, `done` after. It used to be a `current_phase` field written by the same transaction
# that recorded an approval, which made one write the author of two facts that could then disagree.
#
# This file is machine-written. Every change goes through one Central Store transaction
# together with the audit events that explain it, so `rein` is the only writer — editing
# it by hand produces a state change with no matching event, which `doctor` reports and the
# gate guard denies.
#
# A gate reaches `approved` only via a receipt `rein` recorded from a human approval: the gate
# name typed at an interactive terminal, confirmed by `rein approve`. The receipt binds the
# plan/config/machine/human digests and the audit-chain root it was confirmed against. There is
# no other path, no --force, and no hand-edit that survives verification.

project: "product"
cycle_id: cycle-1                      # lowercase slug naming this delta cycle
updated_at: ""

# The two things a human approves. Not the five phases: what a human decides is what the loop may
# change and what it must prove, and then whether the change is taken — never the order the work
# is done in.
gates:
  # gate 1 — the scope the loop may touch, the claims it must make true, and the evidence that
  # counts. Written from /req, /design and /tasks, in whatever order suits the change. Approving it
  # freezes plan.yaml and config.yaml.
  mandate:    { status: pending, receipt: null }
  # gate 2 — the change is taken. Rests on the grounded review, the coverage manifest, the
  # dependency audit and every task being finished.
  acceptance: { status: pending, receipt: null }

plan:
  status: draft                        # draft | frozen | invalidated

execution:
  status: idle

tasks: {}
